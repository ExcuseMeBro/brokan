[package]
name = "kanzo"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local kanban board for you and your agents, with an MCP server"
license = "MIT"
repository = "https://github.com/emanuele-em/kanzo"
homepage = "https://github.com/emanuele-em/kanzo"
readme = "README.md"
keywords = ["kanban", "mcp", "agents", "todo", "board"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rmcp = { version = "=3.7.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "io-util", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
