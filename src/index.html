<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanzo</title>
<link rel="icon" href="/logo.png">
<style>
:root {
  --bg: #f7f7f5; --sidebar: #efefeb; --col: #ededea; --card: #ffffff; --panel: #ffffff;
  --text: #1f1f1c; --muted: #6d6d66; --faint: #9b9b93; --border: #dfdfd9; --hover: #e4e4df;
  --accent: #3b5bdb; --accent-text: #ffffff; --danger: #c92a2a; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --drop: #3b5bdb; --code: #f1f1ed;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181817; --sidebar: #131312; --col: #1e1e1c; --card: #272725; --panel: #20201e;
    --text: #e9e9e4; --muted: #a3a39b; --faint: #74746d; --border: #33332f; --hover: #2c2c29;
    --accent: #7d93ff; --accent-text: #0f1530; --danger: #ff8787; --shadow: 0 1px 2px rgba(0,0,0,.3);
    --drop: #7d93ff; --code: #2c2c29;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 220px minmax(0, 1fr); overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

/* Sidebar */
aside {
  background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; padding: 14px 8px;
}
.brand { font-weight: 650; font-size: 15px; padding: 2px 10px 14px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand img { width: 30px; height: 30px; margin: -6px 0; }
.nav { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.nav a {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
  color: inherit; text-decoration: none; white-space: nowrap;
}
.nav a:hover { background: var(--hover); }
.nav a.active { background: var(--card); box-shadow: var(--shadow); font-weight: 550; }
.nav a .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.nav a .count { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav .label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ghost {
  background: none; border: 0; color: var(--muted); text-align: left;
  padding: 6px 10px; border-radius: 6px; width: 100%;
}
.ghost:hover { background: var(--hover); color: var(--text); }
form.new-project { display: flex; flex-direction: column; gap: 6px; padding: 8px 6px; }
form.new-project .row { display: flex; gap: 6px; }
input.field, textarea.field, select.field {
  background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%;
  outline: none;
}
.field:focus { border-color: var(--accent); }
.btn {
  border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 5px 12px;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 550; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }

/* Main board */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px; flex-wrap: wrap;
}
header .info { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; flex: 1; min-width: 0; }
.search { display: flex; align-items: center; gap: 10px; }
.search .note { color: var(--faint); font-size: 12px; white-space: nowrap; }
.search input { width: 220px; padding: 5px 10px; }
header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .sub { color: var(--muted); }
header .sub a { color: inherit; }
.columns {
  flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr);
  gap: 12px; padding: 0 20px 20px; overflow-x: auto;
}
.column {
  background: var(--col); border-radius: 10px; display: flex; flex-direction: column; min-height: 0;
}
.column h2 {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0; padding: 12px 12px 8px; display: flex; align-items: center; gap: 8px;
}
.column h2 .count { color: var(--faint); font-weight: 500; }
.cards { flex: 0 1 auto; overflow-y: auto; padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 8px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  box-shadow: var(--shadow); cursor: grab; user-select: none;
}
.card:hover { border-color: var(--faint); }
.card.open { border-color: var(--accent); }
.card.dragging { opacity: .4; }
.card .title { overflow-wrap: anywhere; }
.card .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--faint); font-size: 12px; }
.card .meta .spacer { flex: 1; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 99px; padding: 0 7px 0 6px;
}
.tag .dot { width: 6px; height: 6px; }
.drop-line { height: 2px; background: var(--drop); border-radius: 2px; margin: -4px 2px; }
.add { padding: 0 8px 8px; }
.add form { display: flex; flex-direction: column; gap: 6px; }
.add textarea { resize: none; min-height: 54px; }
.add .row { display: flex; gap: 6px; align-items: center; }
.add .row select { flex: 1; min-width: 0; }
.empty {
  margin: auto; text-align: center; color: var(--muted); max-width: 360px; padding: 40px 20px;
}
.empty h1 { color: var(--text); font-size: 18px; }

/* Task panel */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel);
  border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(0,0,0,.12);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .16s ease-out;
  z-index: 10;
}
.panel.shown { transform: none; }
.panel .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.panel .top .key { color: var(--muted); }
.panel .top .spacer { flex: 1; }
.panel .body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
/* The body scrolls instead; without this a long task squeezes the title and textareas to nothing. */
.panel .body > * { flex-shrink: 0; }
.panel .title-input {
  font-size: 18px; font-weight: 650; border: 1px solid transparent; background: none; padding: 4px 6px;
  margin: -4px -6px; border-radius: 6px; width: calc(100% + 12px); resize: none; overflow: hidden; outline: none;
}
.panel .title-input:hover { border-color: var(--border); }
.panel .title-input:focus { border-color: var(--accent); background: var(--card); }
.props { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; color: var(--muted); }
.props select { width: auto; padding: 3px 6px; }
.props span { color: var(--text); }
.section h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px;
  display: flex; align-items: center; gap: 8px; font-weight: 600;
}
.section h3 .ghost { width: auto; padding: 0 6px; font-size: 12px; text-transform: none; letter-spacing: 0; }
.desc textarea { min-height: 200px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
.desc .actions { display: flex; gap: 6px; margin-top: 6px; }
.desc .view { cursor: text; border-radius: 6px; padding: 2px 0; min-height: 24px; }
.desc .placeholder { color: var(--faint); }
.comment { border-top: 1px solid var(--border); padding: 10px 0; }
.comment:first-child { border-top: 0; padding-top: 0; }
.comment .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.comment .who b { color: var(--text); font-weight: 600; }
.new-comment textarea { min-height: 64px; resize: vertical; }
.new-comment .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--faint); font-size: 12px; }

/* Rendered Markdown */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote { margin: 0 0 .6em; }
.md h1, .md h2, .md h3, .md h4 { margin: .8em 0 .4em; font-size: 15px; }
.md h1 { font-size: 17px; }
.md ul, .md ol { padding-left: 1.3em; }
.md li.check { list-style: none; margin-left: -1.3em; }
.md code { background: var(--code); border-radius: 4px; padding: 1px 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.md pre { background: var(--code); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.md pre code { padding: 0; background: none; }
.md blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); }
.md a { color: var(--accent); }

.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.offline { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 4px 12px; border-radius: 99px; font-size: 12px; z-index: 20; }
[hidden] { display: none !important; }

@media (max-width: 700px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; }
  .brand { padding-bottom: 6px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav .label { display: none; }
  #new-project-toggle, form.new-project { display: none; }
  .columns { grid-auto-columns: minmax(78vw, 1fr); padding: 0 12px 12px; }
  header { padding: 12px; }
  .search, .search input { width: 100%; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <img src="/logo.png" alt="">
    Kanzo
  </div>
  <nav class="nav" id="nav"></nav>
  <button class="ghost" id="new-project-toggle">+ New project</button>
  <form class="new-project" id="new-project" hidden>
    <input class="field" name="slug" placeholder="slug, e.g. api" required autocomplete="off" pattern="[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}" title="Letters, digits and -, up to 32">
    <input class="field" name="name" placeholder="Name (optional)" autocomplete="off">
    <input class="field" name="repo" placeholder="GitHub owner/repo (optional)" autocomplete="off">
    <div class="row">
      <button class="btn primary" type="submit">Create</button>
      <button class="btn" type="button" id="new-project-cancel">Cancel</button>
    </div>
  </form>
</aside>

<main>
  <header>
    <div class="info" id="header"></div>
    <div class="search" id="search-box" hidden>
      <span class="note" id="search-note"></span>
      <input class="field" id="search" type="search" placeholder="Search tasks   /" autocomplete="off" spellcheck="false" aria-label="Search tasks">
    </div>
  </header>
  <div class="columns" id="columns"></div>
</main>

<div class="panel" id="panel" aria-hidden="true">
  <div class="top">
    <span class="key mono" id="p-key"></span>
    <span id="p-project"></span>
    <span class="spacer"></span>
    <button class="ghost" style="width:auto" id="p-close" title="Close (Esc)">✕</button>
  </div>
  <div class="body">
    <textarea class="title-input" id="p-title" rows="1" spellcheck="false"></textarea>
    <div class="props">
      Status <span><select class="field" id="p-status"></select></span>
      Created <span id="p-created"></span>
      Updated <span id="p-updated"></span>
    </div>
    <div class="section desc">
      <h3>Description <button class="ghost" id="p-desc-edit">Edit</button></h3>
      <div class="view md" id="p-desc-view" title="Click to edit"></div>
      <div id="p-desc-editor" hidden>
        <textarea class="field" id="p-desc" placeholder="Markdown"></textarea>
        <div class="actions">
          <button class="btn primary" id="p-desc-save">Save</button>
          <button class="btn" id="p-desc-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div class="section">
      <h3>Comments <span class="count" id="p-comment-count"></span></h3>
      <div id="p-comments"></div>
      <form class="new-comment" id="p-comment-form">
        <textarea class="field" id="p-comment" placeholder="Add a comment (Markdown)"></textarea>
        <div class="actions"><span>⌘↵ to send</span><button class="btn primary" type="submit">Comment</button></div>
      </form>
    </div>
    <div><button class="btn danger" id="p-delete">Delete task</button></div>
  </div>
</div>

<div class="offline" id="offline" hidden>Board not reachable — is kanzo running?</div>

<script src="/app.js"></script>
</body>
</html>
